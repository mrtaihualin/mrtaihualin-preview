<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="preview-ui-guard.js?v=2"></script>
  <script src="preview-supabase-stub.js"></script>
  <script src="preview-supabase-config.js"></script>
  <link rel="stylesheet" href="css/shared.css?v=34">
  <link rel="stylesheet" href="css/login-surface.css?v=4">
  <title>Result Login UI — 5.1 Protected Preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f1e5;color:#3d2a0b;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:24px auto 54px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#8b6310;font-weight:800}.tag{padding:6px 10px;border-radius:999px;background:#392708;color:#fff8e8;font-size:12px;font-weight:800}.picker{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.picker button{padding:9px 13px;border:1px solid #d9bd7e;border-radius:999px;background:#fffaf0;color:#6d4805;font-weight:800;cursor:pointer}.picker button[aria-pressed="true"]{background:#9b6a08;color:#fff;border-color:#9b6a08}.result{padding:22px;border:1px solid #ead8b5;border-radius:22px;background:#fff;box-shadow:0 10px 24px rgba(94,61,5,.07)}h1{font-size:28px}h2{margin:0;color:#8b6310}.score{font-size:38px;font-weight:900;color:#9b6a08;margin:12px 0 2px}.summary{color:#74664d}.preview-modal{position:fixed;inset:0;z-index:9999;background:rgba(28,18,4,.82);display:flex;align-items:center;justify-content:center;padding:20px}.preview-modal>div{width:min(420px,100%);background:#fff;border-radius:20px;padding:24px;text-align:center}@media(max-width:560px){.result{padding:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a href="index.html">← Preview Index</a><span class="tag">MOCK RESULT · NO DATA</span></div>
    <h1>遊戲結束畫面 — Login only</h1>
    <p>ตัวอย่าง Result ของทั้ง 6 เกม ใช้ข้อมูลจำลองและ Account Bar แบบ Reading เดียวกัน ไม่มีการอ่านหรือเขียนคะแนนจริง</p>
    <div class="picker" id="picker"></div>
    <section class="result">
      <h2 id="game-title">🎵 Tone</h2>
      <div class="score">80</div>
      <div class="summary">本輪完成 · 預覽分數（模擬資料）</div>
      <div class="v3-page gsh-shell" data-reading-login-component="host" aria-label="登入帳號">
        <div class="rg-tools-row" data-reading-login-component="row">
          <div id="rg-profile-wrap" class="gsh-player-status mrt-login-surface" data-login-surface="single" style="display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;width:100%;box-sizing:border-box;background:#FAF4E8;border:1.5px solid #C8973A;border-radius:16px;padding:10px 12px;">
            <div id="rg-login-slot" style="display:flex;align-items:center;"><button id="rg-login-btn" class="mrt-login-button" type="button" style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#8B6310,#C8973A);color:#fff;border:none;border-radius:20px;padding:6px 16px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:'Noto Sans TC',sans-serif;box-shadow:0 2px 8px rgba(139,99,16,0.28);letter-spacing:0.3px;transition:filter .15s;" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='none'">🔑 登入</button></div>
            <div id="rg-stat-row" class="rg-stat-row" style="display:none;justify-content:flex-start;margin:0;width:auto;max-width:none;gap:8px;"><span class="tf-streak-chip" title="連續天數">🔥 <b id="rg-streak-num">0</b></span></div>
            <div id="rg-cta-login" style="flex:1;min-width:220px;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
  (function(){
    var games=[['🎵','Tone'],['✍️','Reading'],['🎧','Listening'],['⌨️','Typing'],['🧩','Word Order'],['🧱','Lego']];
    var picker=document.getElementById('picker');
    games.forEach(function(game,index){var button=document.createElement('button');button.type='button';button.textContent=game[0]+' '+game[1];button.setAttribute('aria-pressed',index===0?'true':'false');button.onclick=function(){picker.querySelectorAll('button').forEach(function(item){item.setAttribute('aria-pressed','false')});button.setAttribute('aria-pressed','true');document.getElementById('game-title').textContent=button.textContent};picker.appendChild(button)});
    document.getElementById('rg-login-btn').onclick=function(){var modal=document.createElement('div');modal.className='preview-modal';modal.innerHTML='<div><h2>登入帳號</h2><p>UI Preview เท่านั้น — ปิดผู้ให้บริการและการส่งข้อมูลจริง</p><button type="button" style="padding:10px 20px;border:0;border-radius:999px;background:#9b6a08;color:#fff;font-weight:800">關閉</button></div>';modal.querySelector('button').onclick=function(){modal.remove()};document.body.appendChild(modal)};
  })();
  </script>
</body>
</html>
