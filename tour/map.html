<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>即時位置・旅途同行</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3Yn8hZT9Kk0hJLCpNQO5M6R4vdZ3I=" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="map-page">
  <header class="topbar map-topbar">
    <a class="back-link compact" href="./">← <span data-i18n="common.back">返回</span></a>
    <strong data-i18n="map.title">即時位置</strong>
    <div class="status-pill" id="connectionStatus"><span class="status-dot"></span><span data-i18n="status.connecting">連線中</span></div>
  </header>

  <main class="map-shell">
    <div id="map" aria-label="Map showing both participants"></div>
    <section class="map-sheet">
      <div class="map-state-row">
        <div>
          <p class="eyebrow" data-i18n="map.shareState">位置分享狀態</p>
          <h1 id="shareStateTitle" data-i18n="map.closed">尚未分享</h1>
          <p id="shareStateDetail" class="muted" data-i18n="map.requestHelp">任何一方都可以提出分享要求。</p>
        </div>
        <span class="timer" id="shareTimer" hidden>20:00</span>
      </div>

      <div class="map-actions" id="mapActions">
        <button class="primary full" id="requestLocationButton" type="button" data-i18n="map.request">要求分享位置</button>
        <button class="primary full hidden" id="acceptLocationButton" type="button" data-i18n="map.accept">同意分享 20 分鐘</button>
        <a class="secondary full hidden" id="routeButton" target="_blank" rel="noopener" data-i18n="map.route">導航到對方位置</a>
        <button class="secondary full hidden" id="metButton" type="button" data-i18n="map.met">已經見面</button>
        <button class="danger full hidden" id="stopLocationButton" type="button" data-i18n="map.stop">停止分享</button>
      </div>
      <p class="privacy-note" data-i18n="map.privacy">只保存雙方最新位置；分享結束後立即移除。</p>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script type="module" src="./js/map.js"></script>
</body>
</html>
